# Explicit owner action allocation only; add after the production stack:
#   docker compose --project-directory /srv/saas/infra/stacks/insignia \
#     -f /srv/saas/infra/stacks/insignia/compose.yaml -f signing-owner-compose.yaml up -d --no-deps web
# Plan contains nonsecret exact target/validity metadata. The wrapping key stays with
# the signer only. No command, NODE_* override or code mount.
# Retire this overlay after independently verified provisioning: ordinary web
# deployment must omit both mounts below. Preserve the host plan/journal as dated
# evidence; never rewrite its release binding or repeat a consumed allocation.
services:
  web:
    volumes:
      - type: bind
        source: ${INSIGNIA_SIGNING_OWNER_PLAN:?Set the qualified private owner plan file}
        target: /run/insignia/signing-owner-plan.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${INSIGNIA_SIGNING_OWNER_RUN_ROOT:?Set the qualified new private owner run root}
        target: /var/lib/insignia/signing-owner
        read_only: false
        bind:
          create_host_path: false
