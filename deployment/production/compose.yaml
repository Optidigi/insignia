# Insignia production: one compose project, installed as /srv/saas/infra/stacks/insignia/compose.yaml.
# This file is the source of truth for the live stack; deploys change the image tags and release identities here
# first, then install it (deployment/m5-runtime/README.md).
# Secrets: env secrets come from ./.env (0600, interpolation only, `:?` fails closed); secret files from ./secrets/.
# Data: /srv/data/saas/insignia is the LUKS volume (/dev/mapper/insignia). Every bind is long syntax with
# create_host_path: false, so a missing (unmounted) source fails container creation instead of creating it.
# Never run `docker compose config` with output to a terminal or log: it renders the .env secrets.
name: insignia
services:
  database:
    container_name: insignia-database
    image: 'postgres:18.6-bookworm@sha256:9551dd5bf356409a21b31248f49b33bba9bb1877365f3a7e933aecd9af3cf52d'
    restart: unless-stopped
    command:
    - postgres
    - -c
    - 'log_connections=on'
    - -c
    - 'log_disconnections=on'
    - -c
    - 'log_line_prefix=%m [%p] %q%u@%d '
    environment:
      POSTGRES_USER: insignia_rewrite
      POSTGRES_DB: insignia_rewrite
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?}'
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U insignia_rewrite -d insignia_rewrite
      timeout: 3s
      interval: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '15'
    networks:
      private:
        # Fixed address: the host artwork inspector connects by IP. The second alias is pinned by
        # deployment/release-verifier/artifact.mts and scripts/release/collector-native.mts; its removal is
        # server-refactor input (docs/backlog/README.md).
        ipv4_address: 10.0.7.250
        aliases:
        - database
        - insignia-rewrite-m5-019-database
    volumes:
    - type: bind
      source: /srv/data/saas/insignia/postgres
      target: /var/lib/postgresql
      bind:
        create_host_path: false
  signer:
    container_name: insignia-signer
    image: 'insignia/signer:1fe7377d'
    pull_policy: never
    restart: unless-stopped
    init: true
    user: '10101:1000'
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - 'no-new-privileges:true'
    command:
    - /usr/local/bin/node
    - /srv/insignia/worker/dist/signer-main.js
    environment:
      NODE_ENV: production
      DATABASE_URL: '${SIGNER_DATABASE_URL:?}'
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    stop_grace_period: 10s
    tmpfs:
    - '/tmp:size=8m,mode=1777'
    networks:
      private: null
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/node
      - -e
      - 'require(''node:http'').get({socketPath:''/run/insignia/signer/signer.sock'',path:''/health''},(r)=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
    - type: bind
      source: /srv/saas/infra/stacks/insignia/secrets/signing-wrap-keys.json
      target: /run/insignia/signing-wrap-keys.json
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data/saas/insignia/runtime-state/signer-socket
      target: /run/insignia/signer
      read_only: false
      bind:
        create_host_path: false
  web:
    container_name: insignia-web
    logging:
      driver: journald
    cap_drop:
    - ALL
    command:
    - /usr/local/bin/node
    - /srv/insignia/web/dist/server/entry.mjs
    environment:
      APP_URL: 'https://app.insigniacustomizer.com'
      ARTWORK_PROXY_PATH_PREFIX: /apps/insignia
      ARTWORK_R2_BUCKET: insignia-production
      ARTWORK_R2_ENDPOINT: 'https://97984dbfba2fd91f42a4c3fb90fcad09.eu.r2.cloudflarestorage.com'
      ARTWORK_R2_PREFIX: artwork
      ARTWORK_STORAGE_PROFILE: /run/insignia/artwork-storage.json
      ARTWORK_WORKER_READY_SOCKET: /run/insignia/artwork-readiness/ready.sock
      DATABASE_URL: '${WEB_DATABASE_URL:?}'
      HOST: 0.0.0.0
      INSIGNIA_CREDENTIAL_KEY_BASE64: '${INSIGNIA_CREDENTIAL_KEY_BASE64:?}'
      INSIGNIA_CREDENTIAL_KEY_ID: '${INSIGNIA_CREDENTIAL_KEY_ID:?}'
      INSIGNIA_M5_ENTITLEMENT_POLICY_JSON: '{"policyVersion":"lean-v1-recurring-only","maxAgeMs":65000,"plans":[{"planHandle":"insignia-standard","policyId":"lean-v1-standard-all-features","features":["m5.configure","m5.required","m5.logo-later","m5.production-options","m5.pricing"],"billing":"recurring-only"}]}'
      INSIGNIA_M5_FEATURES_JSON: '{"base":"m5.configure","required":"m5.required","logoLater":"m5.logo-later","options":"m5.production-options","pricing":"m5.pricing"}'
      INSIGNIA_M7_BUYER_ENABLED: '1'
      INSIGNIA_M7_EXPECTED_FUNCTIONS_JSON: '{"appKey":"1443cf6d03d39edae7c101a943c5c684"}'
      INSIGNIA_M8_MERCHANT_PREVIEWS_ENABLED: '1'
      INSIGNIA_M8_PURCHASE_ENABLED: '1'
      INSIGNIA_PARTNER_ACCESS_TOKEN: '${INSIGNIA_PARTNER_ACCESS_TOKEN:?}'
      INSIGNIA_PARTNER_ORGANIZATION_ID: '4697030'
      INSIGNIA_RELEASE_PROFILE: native-review-readiness-849a38e1
      INSIGNIA_SHOPIFY_APP_ID: '429028933633'
      NODE_ENV: production
      PORT: '3000'
      SHOPIFY_CLIENT_ID: 1443cf6d03d39edae7c101a943c5c684
      SHOPIFY_CLIENT_SECRET: '${SHOPIFY_CLIENT_SECRET:?}'
      SHOPIFY_WEBHOOK_SECRET: '${SHOPIFY_WEBHOOK_SECRET:?}'
      INSIGNIA_CUSTOMER_EMAIL_ENABLED: '1'
      CUSTOMER_ARTWORK_EMAIL_PROFILE: /run/insignia/customer-artwork-email.json
      INSIGNIA_STORE_SETUP_ENABLED: '1'
      INSIGNIA_EUR_NL_QUALIFICATION: '{"version":"eur-qualification-v2","activeVersionRef":"1268027162625","functionsSourceCommit":"4991bcf9043764aabf28b0c040d5b71609c7a8c0","qualifiedAt":"2026-11-26T17:03:02Z","evidenceRef":"ax-eur-nl-checkout-20261126","countries":["AT","BE","HR","CY","EE","FI","FR","DE","GR","IE","IT","LV","LT","LU","MT","NL","PT","SK","SI","ES"]}'
      CUSTOMER_ARTWORK_EMAIL_QUALIFICATION_PROFILE: /run/insignia/customer-email-qualification.json
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch(''http://127.0.0.1:3000/live'').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))'
      timeout: 5s
      interval: 15s
      retries: 3
      start_period: 15s
    image: 'insignia/web:7c70ae29'
    init: true
    labels:
      traefik.docker.network: proxy
      traefik.enable: 'true'
      traefik.http.routers.insignia-web.entrypoints: websecure
      traefik.http.routers.insignia-web.priority: '1000'
      traefik.http.routers.insignia-web.rule: 'Host(`app.insigniacustomizer.com`)'
      traefik.http.routers.insignia-web.service: insignia-web
      traefik.http.routers.insignia-web.tls.certresolver: letsencrypt
      traefik.http.routers.insignia-uninstall-private.entrypoints: websecure
      traefik.http.routers.insignia-uninstall-private.observability.accesslogs: 'false'
      traefik.http.routers.insignia-uninstall-private.observability.tracing: 'false'
      traefik.http.routers.insignia-uninstall-private.priority: '1100'
      traefik.http.routers.insignia-uninstall-private.rule: 'Host(`app.insigniacustomizer.com`) && PathPrefix(`/api/webhooks/uninstall/`)'
      traefik.http.routers.insignia-uninstall-private.service: insignia-web
      traefik.http.routers.insignia-uninstall-private.tls.certresolver: letsencrypt
      traefik.http.services.insignia-web.loadbalancer.healthcheck.interval: 15s
      traefik.http.services.insignia-web.loadbalancer.healthcheck.path: /live
      traefik.http.services.insignia-web.loadbalancer.healthcheck.timeout: 5s
      traefik.http.services.insignia-web.loadbalancer.server.port: '3000'
      traefik.http.routers.insignia-web.middlewares: insignia-cloudflare-origin
      traefik.http.routers.insignia-uninstall-private.middlewares: insignia-cloudflare-origin
      traefik.http.middlewares.insignia-cloudflare-origin.ipallowlist.sourcerange: '173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32'
      'traefik.http.routers.insignia-web.tls.domains[0].main': app.insigniacustomizer.com
      'traefik.http.routers.insignia-uninstall-private.tls.domains[0].main': app.insigniacustomizer.com
    networks:
      private: null
      proxy: null
    pull_policy: never
    read_only: true
    restart: unless-stopped
    security_opt:
    - 'no-new-privileges:true'
    stop_grace_period: 40s
    tmpfs:
    - '/tmp:size=64m,mode=1777'
    user: node
    volumes:
    - type: bind
      source: /srv/data/saas/insignia/runtime-state/m5-verify
      target: /run/insignia/release-verification
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/saas/infra/stacks/insignia/secrets/r2-web.json
      target: /run/insignia/artwork-storage.json
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data/saas/insignia/runtime-state/artwork-readiness
      target: /run/insignia/artwork-readiness
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data/saas/insignia/runtime-state/signer-socket
      target: /run/insignia/signer
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/saas/infra/stacks/insignia/secrets/customer-artwork-email.json
      target: /run/insignia/customer-artwork-email.json
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/saas/infra/stacks/insignia/secrets/customer-email-qualification.json
      target: /run/insignia/customer-email-qualification.json
      read_only: true
      bind:
        create_host_path: false
  worker:
    container_name: insignia-worker
    logging:
      driver: journald
    cap_drop:
    - ALL
    command:
    - /usr/local/bin/node
    - /srv/insignia/worker/dist/main.js
    environment:
      DATABASE_URL: '${WORKER_DATABASE_URL:?}'
      INSIGNIA_CREDENTIAL_KEY_BASE64: '${INSIGNIA_CREDENTIAL_KEY_BASE64:?}'
      INSIGNIA_CREDENTIAL_KEY_ID: '${INSIGNIA_CREDENTIAL_KEY_ID:?}'
      INSIGNIA_M8_PURCHASE_ENABLED: '1'
      INSIGNIA_RELEASE_PROFILE: native-review-readiness-849a38e1
      INSIGNIA_SHOPIFY_APP_ID: '429028933633'
      NODE_ENV: production
      SHOPIFY_CLIENT_ID: 1443cf6d03d39edae7c101a943c5c684
      SHOPIFY_CLIENT_SECRET: '${SHOPIFY_CLIENT_SECRET:?}'
      APP_URL: 'https://app.insigniacustomizer.com'
      INSIGNIA_PUBLICATION_ABANDONMENT: restore
      INSIGNIA_WORKER_HEALTH_HOST: 0.0.0.0
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/node
      - -e
      - 'fetch(''http://127.0.0.1:4301/ready'').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))'
      timeout: 5s
      interval: 15s
      retries: 3
      start_period: 15s
    image: 'insignia/worker:7c70ae29'
    networks:
      worker-egress: null
      private: null
    pull_policy: never
    read_only: true
    restart: unless-stopped
    security_opt:
    - 'no-new-privileges:true'
    stop_grace_period: 40s
    user: node
    volumes:
    - type: bind
      source: /srv/data/saas/insignia/runtime-state/m5-verify
      target: /run/insignia/release-verification
      read_only: true
      bind:
        create_host_path: false
    ports:
    - target: 4301
      published: '9464'
      host_ip: 127.0.0.1
      protocol: tcp
  verifier:
    container_name: insignia-verifier
    cap_drop:
    - ALL
    cpus: 1
    command:
    - --manifest-sha256
    - 635be0019e8646a0b040dc1e36cf9757949acfc8f073b124f21d961f4d41beda
    - native-review-readiness-849a38e1
    image: 'insignia/verifier:7c70ae29'
    init: true
    mem_limit: '536870912'
    memswap_limit: '536870912'
    networks:
      verifier-egress: null
      private: null
    pids_limit: 64
    pull_policy: never
    read_only: true
    restart: unless-stopped
    security_opt:
    - 'no-new-privileges:true'
    stop_grace_period: 5m20s
    tmpfs:
    - '/tmp:size=32m,mode=1777'
    user: '1000:1000'
    volumes:
    - type: bind
      source: /srv/saas/infra/stacks/insignia/secrets/verifier-startup.json
      target: /run/insignia/verifier-startup.json
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data/saas/insignia/runtime-state/verifier-state
      target: /var/lib/insignia/verifier
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data/saas/insignia/runtime-state/verifier-auth
      target: /var/lib/insignia/verifier-auth
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data/saas/insignia/runtime-state/m5-verify
      target: /run/insignia/release-verification
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - /srv/insignia/verifier/bin/node
      - -e
      - 'const s=require(''node:net'').connect(''/run/insignia/release-verification/collector.sock'',()=>{s.destroy();process.exit(0)});s.on(''error'',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
  heartbeat:
    container_name: insignia-heartbeat
    image: 'insignia/heartbeat:1fe7377d'
    pull_policy: never
    user: '1000:1000'
    init: true
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - 'no-new-privileges:true'
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    volumes:
    - type: bind
      source: /srv/data/saas/insignia/monitor/heartbeat.json
      target: /run/insignia/heartbeat.json
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/saas/infra/stacks/insignia/secrets/relay-secret
      target: /run/insignia/relay-secret
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data/saas/insignia/monitor/aggregates
      target: /run/insignia/aggregates
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - /srv/insignia/bin/node
      - -e
      - 'const fs=require(''node:fs'');process.exit(fs.readdirSync(''/proc'').filter(p=>/^[0-9]+$/.test(p)&&p!==String(process.pid)).some(p=>{try{return fs.readFileSync(''/proc/''+p+''/cmdline'',''utf8'').includes(''/srv/insignia/scripts/operations/heartbeat.mts'')}catch{return false}})?0:1)'
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
  snapshot:
    container_name: insignia-heartbeat-snapshot
    image: 'insignia/heartbeat:1fe7377d'
    pull_policy: never
    user: '1000:1000'
    init: true
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - 'no-new-privileges:true'
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    entrypoint:
    - /srv/insignia/bin/node
    - /srv/insignia/scripts/operations/heartbeat-snapshot.mts
    - --loop
    volumes:
    - type: bind
      source: /srv/data/saas/insignia/monitor/heartbeat-snapshot.json
      target: /run/insignia/heartbeat-snapshot.json
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/saas/infra/stacks/insignia/secrets/monitor-database.json
      target: /run/insignia/monitor-database.json
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data/saas/insignia/monitor/backup-marker
      target: /run/insignia/backup-marker
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/data/saas/insignia/monitor/aggregates
      target: /run/insignia/aggregates
      read_only: false
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - /srv/insignia/bin/node
      - -e
      - 'const s=require(''node:fs'').statSync(''/run/insignia/aggregates/processing.json'');process.exit(Date.now()-s.mtimeMs<180000?0:1)'
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
networks:
  private:
    driver: bridge
    internal: true
    ipam:
      config:
      - subnet: 10.0.7.0/24
        gateway: 10.0.7.1
  worker-egress:
    driver: bridge
    ipam:
      config:
      - subnet: 10.0.8.0/24
        gateway: 10.0.8.1
  verifier-egress:
    driver: bridge
    ipam:
      config:
      - subnet: 10.0.9.0/24
        gateway: 10.0.9.1
  proxy:
    external: true
    name: proxy
