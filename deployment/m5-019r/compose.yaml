name: insignia-rewrite-m5-019

services:
  web:
    image: ${INSIGNIA_WEB_IMAGE:?Set the qualified immutable web image}
    pull_policy: never
    container_name: insignia-rewrite-m5-019-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: runtime.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      APP_URL: https://app.insigniacustomizer.com
      SHOPIFY_CLIENT_ID: 1443cf6d03d39edae7c101a943c5c684
      INSIGNIA_SHOPIFY_APP_ID: "429028933633"
    networks: [proxy, private]
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/live').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      traefik.enable: "${INSIGNIA_ROUTE_ENABLED:-false}"
      traefik.docker.network: proxy
      traefik.http.routers.insignia-canonical-m5-019r.entrypoints: websecure
      traefik.http.routers.insignia-canonical-m5-019r.rule: Host(`app.insigniacustomizer.com`)
      traefik.http.routers.insignia-canonical-m5-019r.priority: "1000"
      traefik.http.routers.insignia-canonical-m5-019r.tls.certresolver: letsencrypt
      traefik.http.routers.insignia-canonical-m5-019r.tls.domains[0].main: app.insigniacustomizer.com
      traefik.http.routers.insignia-canonical-m5-019r.service: insignia-rewrite-m5-019
      traefik.http.routers.insignia-canonical-m5-019r.middlewares: insignia-cloudflare-origin
      # Insignia-only origin lock: refuse connections that do not come from Cloudflare's edge.
      # Pinned copy of cloudflare-ips.json; refresh both together (deployment/m5-runtime/README.md).
      traefik.http.middlewares.insignia-cloudflare-origin.ipallowlist.sourcerange: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      traefik.http.services.insignia-rewrite-m5-019.loadbalancer.server.port: "3000"
      traefik.http.services.insignia-rewrite-m5-019.loadbalancer.healthcheck.path: /live
      traefik.http.services.insignia-rewrite-m5-019.loadbalancer.healthcheck.interval: 15s
      traefik.http.services.insignia-rewrite-m5-019.loadbalancer.healthcheck.timeout: 5s

  database:
    image: postgres:18.6-bookworm@sha256:9551dd5bf356409a21b31248f49b33bba9bb1877365f3a7e933aecd9af3cf52d
    container_name: insignia-rewrite-m5-019-database
    restart: unless-stopped
    env_file: database.env
    networks: [private]
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U insignia_rewrite -d insignia_rewrite"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  proxy:
    external: true
    name: proxy
  private:
    internal: true

volumes:
  database:
