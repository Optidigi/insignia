# Append to the verified current canonical configuration; target database/web only.
# Inspect the rendered configuration privately before any service recreation.
services:
  database:
    ports: !reset []
    # The VPS internal bridge does not activate published host ports. Reserve
    # the qualified database address on that same private network instead.
    networks:
      private:
        ipv4_address: ${INSIGNIA_INSPECTION_DB_ADDRESS:?Set the qualified address in the existing private subnet}
  web:
    environment:
      ARTWORK_STORAGE_PROFILE: /run/insignia/artwork-storage.json
      ARTWORK_R2_ENDPOINT: https://97984dbfba2fd91f42a4c3fb90fcad09.r2.cloudflarestorage.com
      ARTWORK_R2_BUCKET: insignia-demo
      ARTWORK_R2_PREFIX: insignia-rewrite/m6
      ARTWORK_WORKER_READY_SOCKET: /run/insignia/artwork-readiness/ready.sock
    volumes:
      - type: bind
        source: ${INSIGNIA_ARTWORK_STORAGE_PROFILE:?Set the existing private profile}
        target: /run/insignia/artwork-storage.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${INSIGNIA_ARTWORK_READY_DIRECTORY:?Set the owned readiness directory}
        target: /run/insignia/artwork-readiness
        read_only: true
        bind:
          create_host_path: false
