# Template only. The deployed configuration is private: it adds account_id and the HTTPS route
# (a custom domain on insigniacustomizer.com). No account, route or secret is committed.
# Sender alerts@insigniacustomizer.com (onboarded for Cloudflare Email Sending); the fixed
# recipient below must be a verified Email Routing destination address.
name = "insignia-alerts"
main = "worker.mts"
compatibility_date = "2026-10-18"
workers_dev = false
preview_urls = false

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "MONITOR"
class_name = "AlertMonitor"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AlertMonitor"]

[[send_email]]
name = "ALERT_EMAIL"
destination_address = "insignia@optidigi.nl"
