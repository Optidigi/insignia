name: Workspace foundation and boundaries

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'scripts/ci/**'
      - 'scripts/operations/**'
      - 'deployment/alerts/**'
      - 'deployment/backup/**'
      - 'scripts/runtime/**'
      - 'scripts/release/**'
      - 'scripts/worker/**'
      - 'scripts/database/**'
      - 'scripts/privacy/**'
      - 'frontend/**'
      - 'apps/**'
      - 'packages/**'
      - 'crates/**'
      - 'extensions/insignia-*/**'
      - 'scripts/boundaries/**'
      - 'scripts/functions/**'
      - 'biome.json'
      - 'Cargo.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'rust-toolchain.toml'
      - '.github/workflows/foundation.yml'

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: '1.100.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # fixed-ref historical integrity checks require archived commits
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - name: Verify exact status-reference route
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          node --test scripts/ci/status-docs.test.mts
          node scripts/ci/status-docs.mts
      - name: Install pinned Rust and browser dependencies
        if: steps.changes.outputs.route == 'full'
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          corepack pnpm install --frozen-lockfile
          corepack pnpm --filter @insignia/web exec playwright install --with-deps chromium
          corepack pnpm --filter @insignia/designer exec playwright install --with-deps chromium firefox
      - name: Build and check actual workspace
        if: steps.changes.outputs.route == 'full'
        run: corepack pnpm check
      - name: Shopify theme check (theme app extension)
        if: steps.changes.outputs.route == 'full'
        env:
          SHOPIFY_CLI_NO_ANALYTICS: '1'
        run: npx --yes @shopify/cli@5.1.0 theme check --path extensions/insignia-theme --config theme-check:theme-app-extension --fail-level suggestion
      - name: Qualify Ajax carriers against actual production Functions
        if: steps.changes.outputs.route == 'full'
        run: INSIGNIA_FUNCTION_RUNNER="$PWD/.m1-artifacts/tools/function-runner-9.2.2" node --test apps/storefront/test/cart-function-contract.test.mts
      - name: Publication geometry stress (100 cases, no retries)
        if: steps.changes.outputs.route == 'full'
        run: corepack pnpm test:publication-stress && corepack pnpm test:renderer-control
      # pnpm check owns theme-artifact tests (test:vectors) and artifact-manifest.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.changes.outputs.route == 'full'
        with:
          name: m1-001-foundation-${{ github.sha }}
          if-no-files-found: error
          overwrite: false
          retention-days: 14
          path: |
            .m1-artifacts/manifest.json
            .m1-artifacts/replay.json
            .m4-002-artifacts/production-vectors-replay.json
            .m1-artifacts/m4-003-public-config-replay.json
            extensions/insignia-cart-transform/target/cart-transform.raw.wasm
            extensions/insignia-cart-transform/target/cart-transform.wasm
            extensions/insignia-cart-validation/target/cart-validation.raw.wasm
            extensions/insignia-cart-validation/target/cart-validation.wasm
            extensions/insignia-theme/assets/insignia-*.js
            extensions/insignia-theme/assets/insignia-*.css
            apps/storefront/dist/insignia-*.js
            apps/storefront/dist/insignia-*.css
            apps/web/dist/client/**
            apps/web/dist/server/entry.mjs
            apps/worker/dist/main.js
