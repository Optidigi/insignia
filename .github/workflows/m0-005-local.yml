name: M0-005 off-store whole-quote feasibility

on:
  pull_request:
    paths:
      - "spikes/m0-005/**"
      - ".github/workflows/m0-005-local.yml"
  push:
    branches: [main]
    paths:
      - "spikes/m0-005/**"
      - ".github/workflows/m0-005-local.yml"

permissions:
  contents: read

jobs:
  local-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      SHOPIFY_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - name: Install pinned Rust and Wasm target
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Run off-store package check
        working-directory: spikes/m0-005
        run: ./scripts/check-local.sh
      - name: Record exact target artifact hashes
        working-directory: spikes/m0-005
        run: |
          git rev-parse HEAD
          sha256sum extensions/transform/target/wasm32-unknown-unknown/release/m0-005-cart-transform.wasm extensions/validation/target/wasm32-unknown-unknown/release/m0-005-cart-validation.wasm
