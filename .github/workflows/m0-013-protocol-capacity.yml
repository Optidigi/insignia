name: M0-013 off-store protocol capacity

on:
  pull_request:
    paths:
      - "spikes/m0-013/**"
      - "docs/architecture/**"
      - "docs/delivery/**"
      - "AGENTS.md"
      - ".github/workflows/m0-013-protocol-capacity.yml"
  push:
    branches: [main]
    paths:
      - "spikes/m0-013/**"
      - "docs/architecture/**"
      - ".github/workflows/m0-013-protocol-capacity.yml"

permissions:
  contents: read

jobs:
  offstore-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      SHOPIFY_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - name: Install pinned Rust and Wasm target
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Install pinned local tools
        run: |
          (cd spikes/m0-005 && corepack pnpm install --frozen-lockfile)
          (cd spikes/m0-013 && corepack pnpm install --frozen-lockfile)
      - name: Run one-command acceptance suite
        run: bash spikes/m0-013/scripts/check-local.sh
      - name: Bind built results to checked-out source
        if: always()
        run: |
          git rev-parse HEAD
          sha256sum docs/architecture/implementation-plan.md docs/architecture/decision-ledger.md
          find spikes/m0-013/evidence/measurements -type f -name '*.wasm' -print0 | sort -z | xargs -0 -r sha256sum
      - name: Retain measured executables, inputs and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m0-013-offstore-${{ github.sha }}
          if-no-files-found: warn
          path: |
            spikes/m0-013/evidence/measurements/**
