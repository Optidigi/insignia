name: M3-001 PostgreSQL durable core

on:
  pull_request:
    paths:
      - 'packages/application/**'
      - 'packages/database/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/m3-database.yml'
      - '.github/workflows/m1-foundation.yml'
      - 'docs/delivery/**'
  push:
    branches: [main]
    paths:
      - 'packages/application/**'
      - 'packages/database/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/m3-database.yml'

permissions:
  contents: read

jobs:
  durable-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Docker Official Images ECR mirror; same digest as the last successful Docker Hub pull.
        image: public.ecr.aws/docker/library/postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: insignia_test
          POSTGRES_PASSWORD: insignia_test
          POSTGRES_DB: insignia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insignia_test -d insignia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://insignia_test:insignia_test@localhost:5432/insignia_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - run: corepack pnpm install --frozen-lockfile
      - name: Inspect migration state
        run: corepack pnpm exec dbmate --migrations-dir packages/database/migrations status
      - run: corepack pnpm build
      - run: corepack pnpm check:style
      - run: corepack pnpm check:boundaries
      - run: corepack pnpm check:secrets
      - run: corepack pnpm check:database
      - name: M5 100k actual read-seam query plans
        run: M5_QUERY_PLAN_OUTPUT=/tmp/m5-query-plan.json corepack pnpm test:m5-query-plan
      - name: Preserve actual M5 PostgreSQL plans and build hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m5-003-query-plans-${{ github.sha }}
          path: /tmp/m5-query-plan.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
      - name: Rehearse disposable down and up
        # V2 data cannot be downgraded into v1. Rehearse schema rollback in a separate,
        # empty disposable database; qualification rows and historical JSONB stay intact.
        env:
          DATABASE_URL: postgres://insignia_test:insignia_test@localhost:5432/insignia_migration_rehearsal?sslmode=disable
        run: |
          corepack pnpm exec dbmate create
          corepack pnpm db:migrate
          corepack pnpm exec dbmate --no-dump-schema --migrations-dir packages/database/migrations rollback
          corepack pnpm db:migrate
