name: M3-002 local runtime and ingress

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/worker/**'
      - 'packages/application/**'
      - 'packages/database/**'
      - 'packages/shopify/**'
      - 'packages/visualizer/**'
      - 'packages/contracts/**'
      - 'packages/observability/**'
      - 'scripts/m5-002/**'
      - 'scripts/m5-native-inventory/**'
      - 'scripts/m5-host-inventory/**'
      - 'scripts/m5-inventory-phase/**'
      - 'scripts/m5-024/**'
      - 'scripts/m5-runtime/**'
      - 'deployment/m5-runtime/**'
      - 'deployment/m5-019r/**'
      - 'scripts/m5-callback-qualification/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/m3-runtime.yml'
      - 'docs/delivery/**'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/worker/**'
      - 'packages/application/**'
      - 'packages/database/**'
      - 'packages/shopify/**'
      - 'packages/visualizer/**'
      - 'packages/contracts/**'
      - 'packages/observability/**'
      - 'scripts/m5-002/**'
      - 'scripts/m5-native-inventory/**'
      - 'scripts/m5-host-inventory/**'
      - 'scripts/m5-inventory-phase/**'
      - 'scripts/m5-024/**'
      - 'scripts/m5-runtime/**'
      - 'deployment/m5-runtime/**'
      - 'deployment/m5-019r/**'
      - 'scripts/m5-callback-qualification/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/m3-runtime.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        # Docker Official Images ECR mirror; same digest as the last successful Docker Hub pull.
        image: public.ecr.aws/docker/library/postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: insignia_test
          POSTGRES_PASSWORD: insignia_test
          POSTGRES_DB: insignia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insignia_test -d insignia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://insignia_test:insignia_test@localhost:5432/insignia_test?sslmode=disable
      INSIGNIA_REQUIRE_POSTGRES_TEST: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - name: Frozen schema-owner operator and effective PostgreSQL18 roles (isolated database)
        run: M5_SCHEMA_TEST_URL="$DATABASE_URL" node --test --test-concurrency=1 scripts/m5-runtime/schema-provision.test.mjs scripts/m5-runtime/schema-provision-package.test.mjs scripts/m5-runtime/release-append.test.mjs
      - run: corepack pnpm check:style
      - run: corepack pnpm check:boundaries
      - name: Experimental private callback HTTP/operator/restart/supervisor/erasure controls
        run: |
          corepack pnpm exec biome check scripts/m5-callback-qualification
          node --test --test-concurrency=1 scripts/m5-callback-qualification/receiver.test.mjs scripts/m5-callback-qualification/supervisor.test.mjs scripts/m5-callback-qualification/cleanup.test.mjs scripts/m5-callback-qualification/tls-edge.test.mjs
      - name: Bounded read-only inventory controls (local processes only)
        run: corepack pnpm test:m5-inventory
      - run: corepack pnpm check:secrets
      - run: corepack pnpm check:database
      - run: corepack pnpm --filter @insignia/shopify test
      - run: corepack pnpm --filter @insignia/application test
      - run: corepack pnpm --filter @insignia/observability test
      - run: corepack pnpm --filter @insignia/worker test
      - name: M5-024 restricted queue roles and real process crash recovery
        run: node --test --test-concurrency=1 scripts/m5-024/queue-privileges.test.mjs scripts/m5-024/crash-recovery.test.mjs
      - name: M5-024 offline portable worker and drift guards
        run: |
          # Prepare policy metadata for the derived frozen lockfile using normal npm reads.
          # The actual candidate packaging below stays offline; no trust/policy bypass.
          corepack pnpm --filter @insignia/worker deploy --prod --frozen-lockfile --config.inject-workspace-packages=true /tmp/insignia-m5-024-cache-primer
          corepack pnpm install --offline --frozen-lockfile --ignore-scripts --prod=false
          bash scripts/m5-024/build-worker.sh /tmp/insignia-m5-024-worker
          M5_WORKER_PACKAGE_ENTRY=/tmp/insignia-m5-024-worker/dist/main.js node --test scripts/m5-024/worker-guards.test.mjs scripts/m5-024/portable-process.test.mjs
      - name: M5-024 actual disposable worker image and OS controls
        env:
          M5_WORKER_PACKAGE_ENTRY: /tmp/insignia-m5-024-worker/dist/main.js
          M5_IMAGE_EVIDENCE_DIR: ${{ runner.temp }}/m5-024-image-evidence
          M5_IMAGE_ARTIFACT_DIR: ${{ runner.temp }}/m5-024-worker-image
        run: node --test scripts/m5-024/image-artifact.test.mjs scripts/m5-024/image-observations.test.mjs scripts/m5-024/image-runtime.test.mjs
      - name: Frozen schema-owner code mount with qualified worker image (no network/startup)
        env:
          M5_IMAGE_ARTIFACT_DIR: ${{ runner.temp }}/m5-024-worker-image
          M5_WORKER_PACKAGE_ENTRY: /tmp/insignia-m5-024-worker/dist/main.js
        run: node --test scripts/m5-runtime/schema-provision-package.image.test.mjs
      - name: Ordinary canonical web and worker Compose rendering controls
        run: node --test scripts/m5-runtime/web-compose.test.mjs
      - name: Preserve M5-024 image qualification receipts and raw logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m5-024-image-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m5-024-image-evidence
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve qualified ordinary worker deployment image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m5-024-worker-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m5-024-worker-image
          if-no-files-found: error
          retention-days: 3
      - name: Portable current web deployment package
        run: |
          corepack pnpm exec biome check scripts/m5-runtime
          # Prime the legacy deployment's metadata in a fresh runner cache.
          # Qualified package construction below remains offline and frozen.
          corepack pnpm --filter @insignia/web deploy --prod --frozen-lockfile --legacy /tmp/insignia-m5-web-cache-primer
          corepack pnpm install --offline --frozen-lockfile --ignore-scripts --prod=false
          node --test scripts/m5-runtime/web-address.test.mjs scripts/m5-runtime/portable-web.test.mjs
          bash scripts/m5-runtime/build-web.sh /tmp/insignia-m5-web
      - name: Actual current web image startup restart and export
        env:
          M5_WEB_PACKAGE: /tmp/insignia-m5-web
          M5_WEB_IMAGE_EVIDENCE_DIR: ${{ runner.temp }}/m5-web-image-evidence
        run: node --test scripts/m5-runtime/web-image.test.mjs
      - name: Preserve web image qualification receipts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m5-web-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m5-web-image-evidence/*.log
            ${{ runner.temp }}/m5-web-image-evidence/receipt.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve qualified ordinary web deployment image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m5-web-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m5-web-image-evidence/web-image.tar
            ${{ runner.temp }}/m5-web-image-evidence/receipt.json
          if-no-files-found: error
          retention-days: 3
      - name: Generic webhook quarantine through real HTTP and worker
        env:
          M5_025_REQUIRE_SAFE_UNINSTALL: '1'
        working-directory: apps/web
        run: node --test test/webhook-metadata-boundary.test.mjs
      - name: Uninstall authority quarantine and unresolved obligation controls
        env:
          DATABASE_URL: postgres://insignia_test:insignia_test@localhost:5432/insignia_m5_025_http?sslmode=disable
          M5_025_REQUIRE_SAFE_UNINSTALL: '1'
        # Dedicated disposable DB prevents unrelated recovery backlog competing
        # with this bounded process control. Safety assertions are unconditional;
        # transport completion does not fulfill uninstall/privacy obligations.
        run: |
          corepack pnpm exec dbmate create
          corepack pnpm db:migrate
          node --test apps/web/test/uninstall-authority.test.mjs
      - name: Built HTTP ingress with PostgreSQL and queue handoff
        working-directory: apps/web
        run: node --test test/shopify-webhook.test.mjs
      - name: M5 Admin editor and publication with PostgreSQL
        working-directory: apps/web
        run: node --test test/admin/merchant-config.test.mjs test/admin/merchant-publication.test.mjs test/admin/production-composition.test.mjs test/admin/preview-composition.test.mjs test/admin/activation-integration.test.mjs test/admin/activation-state.test.mjs test/admin/release-evidence.test.mjs
      - name: Rehearse disposable migration down and up
        # V2 data cannot be downgraded into v1. Rehearse schema rollback in a separate,
        # empty disposable database; qualification rows and historical JSONB stay intact.
        env:
          DATABASE_URL: postgres://insignia_test:insignia_test@localhost:5432/insignia_migration_rehearsal?sslmode=disable
        run: |
          corepack pnpm exec dbmate create
          corepack pnpm db:migrate
          corepack pnpm exec dbmate --no-dump-schema --migrations-dir packages/database/migrations rollback
          corepack pnpm db:migrate
