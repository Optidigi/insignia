name: M0-001 local Function checks

on:
  pull_request:
    paths:
      - "spikes/m0-001/**"
      - ".github/workflows/m0-001-local.yml"
  push:
    branches: [main]
    paths:
      - "spikes/m0-001/**"
      - ".github/workflows/m0-001-local.yml"

permissions:
  contents: read

jobs:
  function:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      SHOPIFY_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - name: Install pinned Rust and Wasm target
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Install pinned local dependencies
        working-directory: spikes/m0-001
        run: corepack pnpm install --frozen-lockfile
      - name: Run deterministic Function checks
        working-directory: spikes/m0-001
        run: ./scripts/check-local.sh
