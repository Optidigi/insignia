name: M0-009 embedded Astro local proof

on:
  pull_request:
    paths:
      - "spikes/m0-009/**"
      - "docs/delivery/state.md"
      - "docs/delivery/review-packet-M0-009.md"
      - ".github/workflows/m0-009-embedded.yml"
  push:
    branches: [main]
    paths:
      - "spikes/m0-009/**"
      - ".github/workflows/m0-009-embedded.yml"

permissions:
  contents: read

jobs:
  embedded-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - name: Install pinned app proof dependencies
        working-directory: spikes/m0-009
        run: corepack pnpm install --frozen-lockfile
      - name: Check architecture and historical receipts
        run: python3 -B spikes/m0-007/scripts/check-history.py
      - name: Typecheck and test tenant/auth/save boundaries
        working-directory: spikes/m0-009
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: corepack pnpm check
      - name: Build standalone Node adapter and test served output
        working-directory: spikes/m0-009
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          PUBLIC_SHOPIFY_API_KEY: "942e6668fd1177524c0fc48b104b0ac3"
        run: |
          corepack pnpm build
          corepack pnpm smoke:built
      - name: Bind result to source
        run: |
          git rev-parse HEAD
          echo "PR head: ${{ github.event.pull_request.head.sha }}"
          sha256sum docs/architecture/implementation-plan.md docs/architecture/decision-ledger.md
