name: Durable PostgreSQL core

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'scripts/ci/**'
      - 'scripts/database/**'
      - 'packages/application/**'
      - 'packages/database/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/durable-core.yml'

permissions:
  contents: read

jobs:
  durable-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Official Docker Hub route; independently verified existing index digest remains unchanged.
        image: docker.io/library/postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: insignia_test
          POSTGRES_PASSWORD: insignia_test
          POSTGRES_DB: insignia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insignia_test -d insignia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://insignia_test:insignia_test@localhost:5432/insignia_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Verify exact status-reference route
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          node --test scripts/ci/status-docs.test.mts
          node scripts/ci/status-docs.mts
      - run: corepack pnpm install --frozen-lockfile
        if: steps.changes.outputs.route == 'full'
      - name: Inspect migration state
        if: steps.changes.outputs.route == 'full'
        run: corepack pnpm exec dbmate --migrations-dir packages/database/migrations status
      - run: corepack pnpm build
        if: steps.changes.outputs.route == 'full'
      - run: corepack pnpm check:database
        if: steps.changes.outputs.route == 'full'
      - name: Qualify restricted web journey grants with actual LOGINs
        if: steps.changes.outputs.route == 'full'
        run: WEB_RUNTIME_GRANTS_TEST_URL="$DATABASE_URL" corepack pnpm --filter @insignia/database exec vitest run test/web-runtime-grants.test.ts
      - name: 100k actual read-seam query plans
        if: steps.changes.outputs.route == 'full'
        run: M5_QUERY_PLAN_OUTPUT=/tmp/m5-query-plan.json corepack pnpm test:database-query-plan
      - name: Preserve actual PostgreSQL plans and build hashes
        if: steps.changes.outputs.route == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m5-003-query-plans-${{ github.sha }}
          path: /tmp/m5-query-plan.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
      - name: Rehearse disposable down and up
        if: steps.changes.outputs.route == 'full'
        # V2 data cannot be downgraded into v1. Rehearse schema rollback in a separate,
        # empty disposable database; qualification rows and historical JSONB stay intact.
        env:
          DATABASE_URL: postgres://insignia_test:insignia_test@localhost:5432/insignia_migration_rehearsal?sslmode=disable
        run: |
          corepack pnpm exec dbmate create
          corepack pnpm db:migrate
          corepack pnpm exec dbmate --no-dump-schema --migrations-dir packages/database/migrations rollback
          corepack pnpm db:migrate
