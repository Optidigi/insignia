name: M1-001 foundation and boundaries

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'crates/**'
      - 'extensions/insignia-*/**'
      - 'scripts/boundaries/**'
      - 'scripts/m1-functions/**'
      - '.dependency-cruiser.cjs'
      - 'biome.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/m1-foundation.yml'
      - 'docs/delivery/**'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'crates/**'
      - 'extensions/insignia-*/**'
      - 'scripts/boundaries/**'
      - 'scripts/m1-functions/**'
      - 'biome.json'
      - 'Cargo.toml'
      - 'package.json'
      - '.github/workflows/m1-foundation.yml'

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Install pinned Rust and browser dependencies
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          corepack pnpm install --frozen-lockfile
          corepack pnpm --filter @insignia/web exec playwright install --with-deps chromium
      - name: Build and check actual workspace
        run: corepack pnpm check
      - name: Bind current source and build outputs
        run: python3 -B scripts/m1-functions/artifact-manifest.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-001-foundation-${{ github.sha }}
          if-no-files-found: error
          overwrite: false
          retention-days: 14
          path: |
            .m1-artifacts/manifest.json
            .m1-artifacts/replay.json
            extensions/insignia-cart-transform/target/cart-transform.raw.wasm
            extensions/insignia-cart-transform/target/cart-transform.wasm
            extensions/insignia-cart-validation/target/cart-validation.raw.wasm
            extensions/insignia-cart-validation/target/cart-validation.wasm
            extensions/insignia-theme/assets/insignia-storefront.js
            apps/storefront/dist/insignia-storefront.js
            apps/web/dist/client/**
            apps/web/dist/server/entry.mjs
            apps/worker/dist/main.js
