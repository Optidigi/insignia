name: M0-012 real contract local prototype

on:
  pull_request:
    paths:
      - "spikes/m0-012/**"
      - "docs/delivery/evidence/m0-012-real-contract.md"
      - "docs/delivery/review-packet-M0-012.md"
      - "docs/delivery/state.md"
      - ".github/workflows/m0-012-real-contract-local.yml"
      - ".gitignore"
  push:
    branches: [main]
    paths:
      - "spikes/m0-012/**"
      - ".github/workflows/m0-012-real-contract-local.yml"

permissions:
  contents: read

jobs:
  local-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - name: Install pinned local dependencies
        working-directory: spikes/m0-012
        run: corepack pnpm install --frozen-lockfile
      - name: Verify architecture and historical receipts
        run: python3 -B spikes/m0-007/scripts/check-history.py
      - name: Check prototype public seams
        working-directory: spikes/m0-012
        run: corepack pnpm check
      - name: Bind result to source and imported evidence
        run: |
          git rev-parse HEAD
          sha256sum docs/architecture/implementation-plan.md docs/architecture/decision-ledger.md
          sha256sum spikes/m0-012/evidence/baseline/operator-report.md spikes/m0-012/evidence/baseline/partner-active-after-approval.json
