name: M0-011 local provider adapter boundary

on:
  pull_request:
    paths:
      - "spikes/m0-011/**"
      - "docs/delivery/evidence/m0-011-provider-readiness.md"
      - "docs/delivery/review-packet-M0-011.md"
      - "docs/delivery/state.md"
      - "docs/delivery/prompts/M0-011-live-billing-transport.md"
      - ".github/workflows/m0-011-provider-local.yml"
      - ".gitignore"
  push:
    branches: [main]
    paths:
      - "spikes/m0-011/**"
      - ".github/workflows/m0-011-provider-local.yml"

permissions:
  contents: read

jobs:
  provider-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - name: Install frozen billing proof dependencies
        working-directory: spikes/m0-010
        run: corepack pnpm install --frozen-lockfile
      - name: Install frozen provider adapter dependencies
        working-directory: spikes/m0-011
        run: corepack pnpm install --frozen-lockfile
      - name: Verify architecture and historical receipts
        run: python3 -B spikes/m0-007/scripts/check-history.py
      - name: Regress M0-010 billing proof
        working-directory: spikes/m0-010
        run: corepack pnpm check
      - name: Check local provider adapters and guards
        working-directory: spikes/m0-011
        run: corepack pnpm check
      - name: Bind result to source
        run: |
          git rev-parse HEAD
          echo "PR head: ${{ github.event.pull_request.head.sha }}"
          sha256sum docs/architecture/implementation-plan.md docs/architecture/decision-ledger.md
