name: M0-014 local public-app candidate

on:
  pull_request:
    paths:
      - "spikes/m0-014/**"
      - "docs/architecture/**"
      - "docs/delivery/**"
      - "spikes/m0-007/scripts/check-history.py"
      - "AGENTS.md"
      - ".github/workflows/m0-014-public-app-checkout.yml"
  push:
    branches: [main]
    paths:
      - "spikes/m0-014/**"
      - ".github/workflows/m0-014-public-app-checkout.yml"

permissions:
  contents: read

jobs:
  local-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SHOPIFY_CLI_NO_ANALYTICS: "1"
      RUSTUP_TOOLCHAIN: "1.98.1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - name: Install pinned Rust for native verifier and Function tests
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Install pinned local dependencies
        run: |
          (cd spikes/m0-005 && corepack pnpm install --frozen-lockfile)
          (cd spikes/m0-013 && corepack pnpm install --frozen-lockfile)
          (cd spikes/m0-014 && corepack pnpm install --frozen-lockfile)
      - name: Verify source, config, fixture bridge and exact pinned Wasm replay
        run: bash spikes/m0-014/scripts/check-local.sh
      - name: Verify archived decisions and receipts
        run: python3 -B spikes/m0-007/scripts/check-history.py
      - name: Verify saved bounded setup receipts without merchant access
        run: python3 -B spikes/m0-014/scripts/check-live-setup.py
      - name: Bind candidate and architecture to the checked-out head
        if: always()
        run: |
          git rev-parse HEAD
          sha256sum spikes/m0-014/artifacts/*.wasm
          sha256sum docs/architecture/implementation-plan.md docs/architecture/decision-ledger.md
