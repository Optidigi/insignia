api_version = "2026-07"

[[extensions]]
name = "Insignia experimental-v2 cart transform"
handle = "insignia-experimental-v2-transform"
type = "function"
description = "Local preproduction candidate only"

  [[extensions.targeting]]
  target = "cart.transform.run"
  input_query = "src/cart_transform_run.graphql"
  export = "cart_transform_run"

  [extensions.build]
  command = "node ../../scripts/functions/build-wasm.mts transform"
  path = "target/cart-transform.wasm"
  wasm_opt = false
