[package]
name = "cart-authorization"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "=5.0.0", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false }
sha2 = { version = "=0.11.2", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["signature"] }
